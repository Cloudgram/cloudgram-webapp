name: Cloudgram CI/CD

on:
    push:
        branches:
            - main
            - new-design
    pull_request:
        branches:
            - main
            - new-design

jobs:
    build:
        name: 🧪 CI — Install, Lint, Typecheck, Build
        runs-on: ubuntu-latest

        steps:
            - name: 🛎 Checkout repo
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🧹 Lint code
              run: npm run lint

            - name: 🔍 Type check
              run: tsc --noEmit

            - name: 🏗 Build app
              run: npm run build

    docker:
        name: 🐳 CD — Build & Push Docker image
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: 🛎 Checkout repo
              uses: actions/checkout@v4

            - name: 🔧 Set up Docker Build
              uses: docker/setup-buildx-action@v3

            - name: 🔐 Log in to DockerHub
              run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            - name: 🏗 Build Docker image
              run: docker build -t cloudgram-web .

            - name: 🏷 Tag and Push image
              run: |
                  if [ "${{ github.ref }}" == "refs/heads/main" ]; then
                    docker tag cloudgram-web ${{ secrets.DOCKER_USERNAME }}/cloudgram-web:latest
                    docker push ${{ secrets.DOCKER_USERNAME }}/cloudgram-web:latest
                  elif [ "${{ github.ref }}" == "refs/heads/new-design" ]; then
                    echo "Skipping Docker push for new-design branch"
                  fi

    no_dependency_job:
        runs-on: ubuntu-latest
        steps:
            - name: Dummy step
              run: echo "This job has no dependencies"
